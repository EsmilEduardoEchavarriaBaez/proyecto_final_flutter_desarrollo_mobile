# Reglas del analizador estático. Se revisan con `flutter analyze`.
#
# Base: el conjunto recomendado para apps Flutter.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Estilo uniforme en todo el proyecto.
    prefer_single_quotes: true
    prefer_relative_imports: true
    directives_ordering: true
    always_declare_return_types: true

    # Avisa si se olvida esperar (`await`) un Future dentro de una función async.
    unawaited_futures: true
