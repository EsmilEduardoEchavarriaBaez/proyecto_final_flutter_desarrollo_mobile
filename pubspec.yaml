name: proyecto_final_flutter_desarrollo_mobile
description: "Pokédex offline-first con Flutter, Drift y la API GraphQL de PokeAPI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Base de datos local (SQLite) con consultas reactivas.
  drift: ^2.35.3
  drift_flutter: ^0.3.1

  # Manejo de estado e inyección de dependencias.
  flutter_riverpod: ^3.5.0

  # Cliente GraphQL para consultar PokeAPI.
  graphql: ^5.2.4

  # Estado de la red del dispositivo (indicador Online / Offline).
  connectivity_plus: ^7.3.2

  # Imágenes de red con caché en disco: se ven también sin conexión.
  cached_network_image: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generan el código de Drift (app_database.g.dart).
  drift_dev: ^2.35.2
  build_runner: ^2.15.1

  # Solo para las pruebas: simula las respuestas HTTP de PokeAPI.
  http: ^1.6.0

flutter:
  uses-material-design: true
